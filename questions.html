<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discussion Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: one card, four numbered prompts, sized to fill a phone screen. Same type system as the XRL game. */
:root{
  --paper:#e9ecef; --card:#fbfbfa; --ink:#18212c; --muted:#5a6573; --line:#cfd5dc;
  --accent:#c98a00; --accent-soft:#f6ecd2;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10151b; --card:#19202a; --ink:#e5e9ee; --muted:#9ba6b4; --line:#2b3541;
  --accent:#f2b41c; --accent-soft:#33290f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10151b; --card:#19202a; --ink:#e5e9ee; --muted:#9ba6b4; --line:#2b3541;
  --accent:#f2b41c; --accent-soft:#33290f; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
article{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:24px 20px 28px;display:flex;flex-direction:column;gap:20px}
article::after{content:"?";position:absolute;right:-14px;bottom:-60px;font-family:var(--f-body);font-weight:600;font-size:260px;line-height:1;color:var(--accent);opacity:.16;pointer-events:none}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-size:clamp(34px,9vw,48px);font-weight:800;font-stretch:75%;text-transform:uppercase;margin:0;line-height:1}
ol{list-style:none;margin:0;padding:0;counter-reset:q;border-top:1px solid var(--line);position:relative;z-index:1}
li{counter-increment:q;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:baseline;padding-block:16px;border-bottom:1px solid var(--line);font-size:clamp(19px,5vw,22px);line-height:1.35;text-wrap:pretty}
li::before{content:counter(q);font-family:var(--f-display);font-weight:800;font-stretch:75%;font-size:30px;color:var(--accent);line-height:1}
</style>
</head>
<body>

<div class="wrap">
<article>
<span class="eyebrow">Discuss in your group</span>
<h1>Questions</h1>
<ol>
<li>Where did the project requirements come from?</li>
<li>How did the team handle not knowing the answer at the start?</li>
<li>What was the role of the leader?</li>
<li>What was the shape of the process over the five days?</li>
</ol>
</article>
</div>
</body>
</html>
